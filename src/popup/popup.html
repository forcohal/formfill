<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormFriend</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="state-no-profile" class="state-view">
    <div class="ff-logo-section">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <p class="ff-tagline">Set up your profile to get started</p>
    <button id="btn-create-profile" class="ff-btn ff-btn-primary ff-btn-full">Create Profile</button>
  </div>

  <div id="state-profile-ready" class="state-view" hidden>
    <div class="ff-logo-section">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <div class="ff-status-badge success">
      <span>✓</span> Profile Ready
    </div>
    <div class="ff-profile-summary" id="profile-summary"></div>
    <div class="ff-btn-group">
      <button id="btn-edit-profile" class="ff-btn ff-btn-secondary ff-btn-full">Edit Profile</button>
      <button id="btn-scan-form" class="ff-btn ff-btn-primary ff-btn-full">Scan This Page</button>
    </div>
  </div>

  <div id="state-scanning" class="state-view" hidden>
    <div class="ff-logo-section small">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <div class="ff-status-badge scanning">
      <span class="ff-spinner"></span> Analyzing fields…
    </div>
    <p class="ff-subtitle">Form detected on this page</p>
  </div>

  <div id="state-mapped" class="state-view" hidden>
    <div class="ff-logo-section small">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <div class="ff-status-badge info">
      <span id="field-count">0</span> fields identified
    </div>
    <button id="btn-review-fill" class="ff-btn ff-btn-primary ff-btn-full">Review & Fill</button>
  </div>

  <div id="state-filled" class="state-view" hidden>
    <div class="ff-logo-section small">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <div class="ff-status-badge success">
      <span>✓</span> Form filled successfully
    </div>
    <button id="btn-check-mismatches" class="ff-btn ff-btn-secondary ff-btn-full">Check for Mismatches</button>
    <button id="btn-reset" class="ff-btn ff-btn-ghost ff-btn-full">Reset</button>
  </div>

  <div id="state-mismatch" class="state-view" hidden>
    <div class="ff-logo-section small">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <div class="ff-status-badge warning">
      ⚠ <span id="mismatch-count">0</span> mismatches detected
    </div>
    <button id="btn-review-mismatches" class="ff-btn ff-btn-danger ff-btn-full">Review</button>
  </div>

  <div id="state-profile-form" class="state-view" hidden>
    <div class="ff-logo-section small">
      <span class="ff-emoji">🤝</span>
      <h1>FormFriend</h1>
    </div>
    <form id="profile-form" class="ff-profile-form">
      <div class="ff-form-group">
        <label for="pf-firstName">First Name</label>
        <input type="text" id="pf-firstName" name="firstName" placeholder="Anant" required>
      </div>
      <div class="ff-form-group">
        <label for="pf-middleName">Middle Name</label>
        <input type="text" id="pf-middleName" name="middleName" placeholder="Kumar">
      </div>
      <div class="ff-form-group">
        <label for="pf-lastName">Last Name</label>
        <input type="text" id="pf-lastName" name="lastName" placeholder="Agarwal" required>
      </div>
      <div class="ff-form-group">
        <label for="pf-email">Email</label>
        <input type="email" id="pf-email" name="email" placeholder="anant@example.com" required>
      </div>
      <div class="ff-form-group">
        <label for="pf-phone">Phone</label>
        <input type="tel" id="pf-phone" name="phone" placeholder="+91 9876543210">
      </div>
      <div class="ff-form-group">
        <label for="pf-dateOfBirth">Date of Birth</label>
        <input type="text" id="pf-dateOfBirth" name="dateOfBirth" placeholder="DD/MM/YYYY">
      </div>
      
      <div class="ff-form-group">
        <label for="pf-gender">Gender</label>
        <select id="pf-gender" name="gender">
          <option value="">Select...</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="ff-form-group">
        <label for="pf-maritalStatus">Marital Status</label>
        <select id="pf-maritalStatus" name="maritalStatus">
          <option value="">Select...</option>
          <option value="Single">Single</option>
          <option value="Married">Married</option>
          <option value="Divorced">Divorced</option>
          <option value="Widowed">Widowed</option>
        </select>
      </div>
      <div class="ff-form-group">
        <label for="pf-country">Country</label>
        <input type="text" id="pf-country" name="country" placeholder="India">
      </div>
      
      <div class="ff-form-group" style="flex-direction: row; align-items: center; gap: 8px;">
        <input type="checkbox" id="pf-student" name="student" style="width: auto;">
        <label for="pf-student" style="margin: 0;">I am a student</label>
      </div>

      <div class="ff-form-group">
        <label for="pf-college">College</label>
        <input type="text" id="pf-college" name="college" placeholder="CUSAT">
      </div>
      <div class="ff-form-group">
        <label for="pf-department">Department</label>
        <input type="text" id="pf-department" name="department" placeholder="Information Technology">
      </div>
      <div class="ff-form-group">
        <label for="pf-semester">Semester</label>
        <input type="text" id="pf-semester" name="semester" placeholder="6">
      </div>
      <!-- Container for dynamic fields added from forms -->
      <div id="dynamic-fields-container"></div>
      
      <div class="ff-btn-group">
        <button type="button" id="btn-cancel-profile" class="ff-btn ff-btn-secondary">Cancel</button>
        <button type="submit" class="ff-btn ff-btn-primary">Save Profile</button>
      </div>
      <button type="button" id="btn-delete-profile" class="ff-btn ff-btn-ghost ff-btn-full ff-btn-danger-text">
        Delete Profile
      </button>
    </form>
  </div>

  <script src="../storage/profileStorage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
